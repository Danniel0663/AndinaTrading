<!doctype html>
<html lang="es">
  <head th:replace="~{base :: head('Iniciar sesión')}"></head>
  <body class="auth">
    <section class="cover contours">
      <a class="brand" href="/index"
        ><span class="mark" aria-hidden="true">◭</span> Andina<span class="thin"
          >Trading</span
        ></a
      >
      <div>
        <small>ANDINA TRADING</small>
        <h2>Simulador de <br />inversiones</h2>
      </div>
    </section>
    <main>
      <section>
        <h1>Iniciar sesión</h1>
        <form method="post" action="/login">
          <label
            >Correo electrónico<input
              type="email"
              name="email"
              autocomplete="username"
              required /></label
          ><label
            >Contraseña<input
              type="password"
              name="contrasena"
              autocomplete="current-password"
              required
          /></label>
          <p class="alert" th:if="${error}" th:text="${error}"></p>
          <button>Entrar a mi cuenta →</button>
        </form>
        <p>¿Primera vez aquí? <a href="/newusuarios">Crear cuenta</a></p>
      </section>
    </main>
  </body>
</html>
