<!doctype html>
<html lang="es">
  <head th:replace="~{base :: head('Cuenta de inversión')}"></head>
  <body class="auth">
    <section class="cover contours">
      <a class="brand" href="/index"
        ><span class="mark" aria-hidden="true">◭</span> Andina<span class="thin"
          >Trading</span
        ></a
      >
      <div>
        <small>ANDINA TRADING</small>
        <h2>Simulador de <br />inversiones</h2>
      </div>
    </section>
    <main>
      <section>
        <h1>Cuenta de inversión</h1>
        <form method="post" action="/saveusuarios" th:object="${usuario}">
          <input type="hidden" th:field="*{idUsuario}" />
          <div>
            <label for="nombre" class="form-label">Nombre</label>
            <input
              th:field="*{nombre}"
              id="nombre"
              type="text"
              class="form-control"
              required
            />
          </div>
          <div>
            <label for="email" class="form-label">Email</label>
            <input
              th:field="*{email}"
              id="email"
              type="email"
              class="form-control"
              required
            />
          </div>
          <div>
            <label for="contrasena" class="form-label">Contraseña</label>
            <input
              th:field="*{contrasena}"
              id="contrasena"
              type="password"
              class="form-control"
              required
            />
          </div>
          <div>
            <label for="rol" class="form-label">Rol</label>
            <select th:field="*{rol}" id="rol" class="form-control" required>
              <option value="INVERSIONISTA">Inversionista</option>
              <option value="ADMIN">ADMIN</option>
            </select>
          </div>
          <div>
            <label for="balance" class="form-label">Balance</label>
            <input
              th:field="*{balance}"
              id="balance"
              type="number"
              step="0.01"
              class="form-control"
              required
            />
          </div>
          <div>
            <label for="autenticacionDobleFactor" class="form-label"
              >Autenticación Doble Factor</label
            >
            <input
              th:field="*{autenticacionDobleFactor}"
              id="autenticacionDobleFactor"
              type="checkbox"
              class="form-check-input"
            />
          </div>
          <button>Guardar cuenta</button>
        </form>
        <p><a href="/index">Volver al acceso</a></p>
      </section>
    </main>
  </body>
</html>
